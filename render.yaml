services:
  - type: web
    name: cinematch
    runtime: python
    plan: free
    # Build the TF-IDF model here: building needs ~640 MB, but serving the
    # cached model needs only ~200 MB (free tier allows 512 MB at runtime).
    buildCommand: pip install -r requirements.txt && python recommender.py "Avatar" --rebuild -n 1
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
